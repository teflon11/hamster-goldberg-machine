<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#141821;
  font:16px/1.45 "Segoe UI",system-ui,-apple-system,Arial,sans-serif;color:#eef2f8}
button{font:inherit}

#scene{position:fixed;top:0;left:0;right:0;height:calc(100% - var(--bar,72px));overflow:hidden;
  background:
    radial-gradient(120% 90% at 50% 0%,#33415c 0%,#1d2536 55%,#121722 100%);}
#view{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:contain}

/* панель этапов поверх сцены: справа сверху, чтобы не закрывать горку со стартом */
#stages{position:absolute;top:12px;right:12px;max-width:min(42%,400px);padding:10px 12px 11px;
  border-radius:12px;background:rgba(12,16,24,.72);border:1px solid rgba(255,255,255,.13);
  box-shadow:0 8px 26px rgba(0,0,0,.45);backdrop-filter:blur(3px)}
#stages h2{margin:0 0 7px;font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:#8fa3c4;font-weight:600}
#stages ol{margin:0;padding:0;list-style:none;display:grid;gap:3px}
#stages li{display:flex;gap:7px;align-items:baseline;font-size:12.5px;line-height:1.3;color:#7e8ca4}
#stages li b{flex:0 0 auto;width:15px;font-weight:600;font-variant-numeric:tabular-nums;color:#5d6b83;text-align:right}
#stages li.now{color:#ffe9a8}
#stages li.now b{color:#ffd451}
#stages li.ok{color:#9fe6b4}
#stages li.ok b{color:#4ecb71}
#stages li.ok span{text-decoration:line-through;text-decoration-color:rgba(159,230,180,.45)}
#tag{position:absolute;bottom:10px;left:14px;padding:6px 12px;border-radius:999px;
  background:rgba(12,16,24,.6);border:1px solid rgba(255,255,255,.1);
  font-size:11.5px;letter-spacing:.04em;color:#8ea1c0}

#win{position:absolute;left:0;right:0;bottom:14px;display:none;justify-content:center;pointer-events:none}
#win.on{display:flex}
#win div{padding:11px 24px;border-radius:13px;background:rgba(10,14,22,.86);
  border:2px solid #ffd451;box-shadow:0 12px 34px rgba(0,0,0,.55);text-align:center}
#win b{display:block;font-size:clamp(17px,2.8vw,26px);color:#ffe9a8}
#win i{display:block;font-style:normal;font-size:clamp(11px,1.6vw,14px);color:#ffd451;margin-top:2px}

#bar{position:fixed;bottom:0;left:0;right:0;display:flex;align-items:center;gap:14px;
  flex-wrap:nowrap;padding:12px 16px;background:#0d1119;border-top:1px solid #2b3548}
#bar .ttl{flex:0 0 auto;font-weight:700;font-size:14px;letter-spacing:.02em;white-space:nowrap}
#bar .ttl i{display:block;font-style:normal;font-weight:500;font-size:11px;color:#7f8ea8;letter-spacing:.06em}
#status{flex:1 1 auto;min-width:0;font-size:13.5px;color:#b9c8e0;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
#status.bad{color:#ffb3a7}
#status.good{color:#9fe6b4}
#prog{flex:0 0 auto;font-size:13px;color:#8fa3c4;font-variant-numeric:tabular-nums;white-space:nowrap}
#bar .btns{flex:0 0 auto;display:flex;gap:9px}
#bar button{padding:9px 19px;border-radius:9px;border:1px solid #46536e;background:#1b2434;
  color:#e8eefb;cursor:pointer;white-space:nowrap;font-weight:600;font-size:13.5px}
#bar button:hover:not(:disabled){background:#26324a;border-color:#5d6f92}
#bar button:disabled{opacity:.42;cursor:default}
#bar button.go{background:#e8b427;border-color:#f0c85a;color:#231a03}
#bar button.go:hover:not(:disabled){background:#f5c63d}

@media (max-width:720px){
  #bar{gap:9px;padding:10px 11px}
  #bar .ttl i{display:none}
  #prog{display:none}
  #stages{max-width:56%;padding:8px 10px 9px}
  #tag{display:none}
}
@media (max-width:460px){
  #bar .ttl{font-size:12px}
  #status{font-size:12px}
  #bar button{padding:8px 13px;font-size:12.5px}
  #stages{max-width:64%}
  #stages li{font-size:10.5px}
  #stages h2{font-size:10px}
}
</style>
</head>
<body>
<div id="scene">
  <canvas id="view" width="1600" height="900"></canvas>
  <div id="stages"><h2>Этапы машины</h2><ol id="stageList"></ol></div>
  <div id="tag">Экспонат работает на движке Matter.js · настоящая физика</div>
  <div id="win"><div><b>Хомяк проснулся!</b><i>колокольчик звенит, колесо крутится</i></div></div>
</div>
<footer id="bar">
  <div class="ttl">Экспонат №7<i>машина Голдберга</i></div>
  <div id="status">Нажмите «Пуск» — и машина разбудит хомяка.</div>
  <div id="prog">0/8</div>
  <div class="btns">
    <button id="start" class="go">Пуск</button>
    <button id="reset">Сброс</button>
  </div>
</footer>
